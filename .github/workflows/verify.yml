name: verify

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  reference-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[raw,reference]'
      - run: python -m portra160_lab.cli list-stocks
      - run: python -c "import numpy as np; np.save('ci_input.npy', np.full((8,8,3), 0.25, dtype='float32'))"
      - run: portra160-lab render-matrix --input ci_input.npy --out-dir ci-matrix --stocks portra400 vision3_250d
      - run: python -c "import json; m=json.load(open('ci-matrix/manifest.json')); assert len(m['records']) == 2 and all(r['source_commit_verified'] for r in m['records']) and all(len(r['output_sha256']) == 64 for r in m['records'])"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-matrix-manifest
          path: ci-matrix/manifest.json
